# Local full stack: MongoDB + API + worker + frontend.
#   cp .env.example .env   (then set JWT_SECRET)
#   docker compose up --build
# Frontend: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  # Same image, different command: runs the scheduler. Run exactly one (more are safe, but useless).
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.monitoring.worker"]
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: